<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f0a500'/%3E%3Cpath d='M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z' fill='%231c1a15'/%3E%3C/svg%3E" />
    <title>Шохрух электрик</title>
    <script>
      // Sozlamalar sahifa chizilishidan oldin qo'yiladi — rang "lip" etib almashmasin.
      // Xuddi shu ish src/lib/settings.ts → applySettings() da ham bor.
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('elektrik-smeta-settings')) || {}; } catch (e) {}
        var r = document.documentElement, m = s.mode || 'auto';
        r.classList.toggle('dark', m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches));
        r.dataset.accent = s.accent || 'amber';
        r.dataset.cells = s.cells || 'color';
        r.dataset.size = s.size || 'm';
        r.lang = s.lang || 'uz';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
